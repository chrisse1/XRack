application:
  name: "XRack"
  version: "0.9.7"
  # "de" oder "en" - wird von install.sh in config/local.yaml
  # abgefragt und überschrieben.
  language: "de"

server:
  host: "0.0.0.0"
  port: 8080
  # Selbstsigniertes Zertifikat, von install.sh erzeugt. Existieren
  # beide Dateien nicht (z.B. vor dem ersten install.sh-Lauf), läuft
  # main.py automatisch unverschlüsselt über HTTP weiter.
  ssl_certfile: "certs/xrack.crt"
  ssl_keyfile: "certs/xrack.key"

recording:
  directory: "./recordings"

music:
  directory: "./music"

logging:
  level: "INFO"
