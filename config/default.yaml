application:
  name: "XRack"
  version: "1.3.1"
  # "de" oder "en" - wird von install.sh in config/local.yaml
  # abgefragt und überschrieben.
  language: "de"

server:
  host: "0.0.0.0"
  port: 8080
  # Selbstsigniertes Zertifikat, von install.sh erzeugt. Existieren
  # beide Dateien nicht (z.B. vor dem ersten install.sh-Lauf), läuft
  # main.py automatisch unverschlüsselt über HTTP weiter.
  ssl_certfile: "certs/xrack.crt"
  ssl_keyfile: "certs/xrack.key"

security:
  # Gehashte 4-stellige PIN zum Schutz des Einstellungen-Modals. Leer
  # = kein Schutz aktiv (z.B. vor dem ersten install.sh-Lauf mit
  # dieser Funktion). install.sh fragt die PIN bei der Installation
  # ab; sie lässt sich im Einstellungen-Modal jederzeit ändern.
  pin_hash: ""

audio:
  # Tatsächliche Samplerate des angeschlossenen Interfaces (z.B.
  # 44100 oder 48000). Mischpulte wie die X32/XAir-Serie melden über
  # USB immer beide als "unterstützt", schalten ihre Clock aber nicht
  # selbst um - dieser Wert muss darum am Mischpult geprüft und hier
  # (bzw. im Einstellungen-Modal) passend gesetzt werden.
  sample_rate: 48000

recording:
  directory: "./recordings"

music:
  directory: "./music"

logging:
  level: "INFO"

update:
  # Quelle für das Update aus dem Internet. Der Weg über den USB-Stick
  # braucht diese Angaben nicht - dort bringt der Nutzer die ZIP-Datei
  # selbst mit.
  repository: "chrisse1/XRack"
  branch: "main"
