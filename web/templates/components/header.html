<header class="d-flex mb-4 container justify-content-between align-items-start">

  <div class="d-flex flex-column">

    <img
        src="/static/img/logo.png"
        alt="XRack"
        class="header-logo"
    >

    <small class="text-secondary">
        v{{ application.config.data.application.version }}
    </small>

  </div>

  <div class="d-flex gap-2">

    {#
        Der Stick als Dateimanager: nachsehen, was darauf liegt, und
        Dateien oder ganze Ordner auf das Geraet holen. Steht neben dem
        Auswerfen, weil beides denselben Stick meint - und beide nur
        sichtbar sind, wenn einer steckt.
    #}
    <button
        id="btn-usb-browse"
        class="btn btn-outline-secondary btn-sm d-none"
        title="{{ t.btn_usb_browse }}"
    >
        <i class="bi bi-folder2-open"></i>
    </button>

    <button
        id="btn-usb-eject"
        class="btn btn-outline-secondary btn-sm d-none"
        title="{{ t.btn_usb_eject }}"
    >
        <i class="bi bi-eject"></i>
    </button>

    <button
        id="btn-settings"
        class="btn btn-outline-secondary btn-sm"
        title="{{ t.settings_icon_title }}"
    >
        <i class="bi bi-gear"></i>
    </button>

  </div>

</header>
