<!doctype html>
<html lang="{{ lang }}">
<head>

    <meta charset="utf-8">

    <title>{{ application.config.data.application.name }}</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <meta name="theme-color" content="#1d2125">

    <!-- Favicon -->
    <link rel="icon" href="/static/img/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/static/img/icon.png">

    <!-- Safari: "Zum Home-Bildschirm hinzufügen" -->
    <link rel="apple-touch-icon" href="/static/img/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="XRack">

    <!-- PWA-Manifest (Android/Chrome "Installieren") -->
    <link rel="manifest" href="/static/manifest.json">

    <link rel="stylesheet"
      href="/static/css/bootstrap.min.css">

    <link rel="stylesheet"
      href="/static/css/bootstrap-icons.css">

    <link rel="stylesheet"
      href="/static/css/xrack.css">

</head>

<body>

{% block content %}
{% endblock %}

<div
    class="modal fade"
    id="recordingsModal"
    tabindex="-1"
    aria-hidden="true"
>
    <div class="modal-dialog modal-xl">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    {{ t.modal_recordings_title }}
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>

            <div class="modal-body">

              <div
                  id="recordingsList"
                  class="list-group"
              >
              </div>

            </div>

            <div class="modal-footer flex-column flex-sm-row">
                <button
                    id="deleteSelectedButton"
                    class="btn btn-danger modal-footer-btn"
                    disabled
                >
                    <i class="bi bi-trash"></i>
                    {{ t.btn_delete_selected }} (0)
                </button>

                <button
                    class="btn btn-secondary modal-footer-btn"
                    data-bs-dismiss="modal"
                >
                    {{ t.btn_close }}
                </button>

            </div>

        </div>

    </div>
</div>

<div
    class="modal fade"
    id="musicModal"
    tabindex="-1"
    aria-hidden="true"
>
    <div class="modal-dialog modal-xl">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    {{ t.modal_music_title }}
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>

            <div class="modal-body">

                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb" id="musicBreadcrumb"></ol>
                </nav>

                <div class="d-flex gap-2 mb-3 flex-wrap">
                    <button
                        id="btn-play-current-folder"
                        class="btn btn-success btn-sm flex-fill"
                    >
                        <i class="bi bi-shuffle me-2"></i>
                        {{ t.btn_play_folder_shuffle }}
                    </button>

                    <button
                        id="btn-new-folder"
                        class="btn btn-outline-secondary btn-sm"
                    >
                        <i class="bi bi-folder-plus me-2"></i>
                        {{ t.btn_new_folder }}
                    </button>

                    <label class="btn btn-outline-primary btn-sm mb-0">
                        <i class="bi bi-upload me-2"></i>
                        {{ t.btn_upload }}
                        <input
                            type="file"
                            id="music-upload-input"
                            accept=".mp3,.wav,.flac,.ogg,.m4a,.aac,.wma"
                            multiple
                            hidden
                        >
                    </label>
                </div>

                <div id="uploadProgressWrapper" class="mb-3 d-none">
                    <div class="progress" style="height: 8px;">
                        <div
                            id="uploadProgressBar"
                            class="progress-bar"
                            role="progressbar"
                            style="width: 0%"
                        ></div>
                    </div>
                    <small
                        id="uploadProgressLabel"
                        class="text-body-secondary"
                    ></small>
                </div>

                <div
                    id="musicList"
                    class="list-group"
                >
                </div>

            </div>

            <div class="modal-footer">
                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    {{ t.btn_close }}
                </button>
            </div>

        </div>

    </div>
</div>

<script>window.I18N = {{ i18n_json | safe }};</script>
<script src="{{ url_for('static', path='js/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', path='js/xrack.js') }}"></script>
</body>

</html>
