<!doctype html>
<html lang="de">
<head>

    <meta charset="utf-8">

    <title>{{ title }}</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
      href="/static/css/bootstrap.min.css">

    <link rel="stylesheet"
      href="/static/css/bootstrap-icons.css">

    <link rel="stylesheet"
      href="/static/css/xrack.css">

</head>

<body>

{% block content %}
{% endblock %}

<div
    class="modal fade"
    id="recordingsModal"
    tabindex="-1"
    aria-hidden="true"
>
    <div class="modal-dialog modal-xl">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Aufnahmen
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>

            <div class="modal-body">
              
              <div
                  id="recordingsList"
                  class="list-group"
              >
              </div>

            </div>

            <div class="modal-footer">
                <button
                    id="deleteSelectedButton"
                    class="btn btn-danger"
                    disabled
                >
                    <i class="bi bi-trash"></i>
                    Ausgewählte löschen (0)
                </button>

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Schließen
                </button>

            </div>

        </div>

    </div>
</div>

<div
    class="modal fade"
    id="musicModal"
    tabindex="-1"
    aria-hidden="true"
>
    <div class="modal-dialog modal-xl">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Musikbibliothek
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>

            <div class="modal-body">

                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb" id="musicBreadcrumb"></ol>
                </nav>

                <div class="d-flex gap-2 mb-3 flex-wrap">
                    <button
                        id="btn-play-current-folder"
                        class="btn btn-success btn-sm flex-fill"
                    >
                        <i class="bi bi-shuffle me-2"></i>
                        Diesen Ordner zufällig abspielen
                    </button>

                    <button
                        id="btn-new-folder"
                        class="btn btn-outline-secondary btn-sm"
                    >
                        <i class="bi bi-folder-plus me-2"></i>
                        Neuer Ordner
                    </button>

                    <label class="btn btn-outline-primary btn-sm mb-0">
                        <i class="bi bi-upload me-2"></i>
                        Hochladen
                        <input
                            type="file"
                            id="music-upload-input"
                            accept=".mp3,.wav,.flac,.ogg,.m4a,.aac,.wma"
                            multiple
                            hidden
                        >
                    </label>
                </div>

                <div id="uploadProgressWrapper" class="mb-3 d-none">
                    <div class="progress" style="height: 8px;">
                        <div
                            id="uploadProgressBar"
                            class="progress-bar"
                            role="progressbar"
                            style="width: 0%"
                        ></div>
                    </div>
                    <small
                        id="uploadProgressLabel"
                        class="text-body-secondary"
                    ></small>
                </div>

                <div
                    id="musicList"
                    class="list-group"
                >
                </div>

            </div>

            <div class="modal-footer">
                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Schließen
                </button>
            </div>

        </div>

    </div>
</div>

<script src="{{ url_for('static', path='js/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', path='js/xrack.js') }}"></script>
</body>

</html>
